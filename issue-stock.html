<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stock - Issue Stock</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <script src="sw-register.js"></script>
    <script src="offline-sync.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function() {
            emailjs.init("zY88iAsGDKuuwCdRa");
        })();
    </script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwcI_RRe3nRS8ZLxExsyyT4PDdtv5g4kg",
            authDomain: "smart-stock-app-da50f.firebaseapp.com",
            projectId: "smart-stock-app-da50f",
            storageBucket: "smart-stock-app-da50f.appspot.com",
            messagingSenderId: "512981075308",
            appId: "1:512981075308:web:491c04288f19aa26775f49",
            measurementId: "G-QPCK6Q566V"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log("🔥 Firebase connected!");

        // ============================================
        // GET CURRENT COMPANY ID
        // ============================================
        function getCurrentCompanyId() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            return currentUser?.companyId || 'default';
        }

        // ============================================
        // GET PRODUCTS (FILTERED BY COMPANY)
        // ============================================
        async function getProducts() {
            try {
                const companyId = getCurrentCompanyId();
                const snapshot = await db.collection('products')
                    .where('companyId', '==', companyId)
                    .get();
                const products = [];
                snapshot.forEach(doc => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                return products;
            } catch (error) {
                console.error("❌ Error getting products:", error);
                return [];
            }
        }

        // ============================================
        // UPDATE PRODUCT QUANTITY
        // ============================================
        async function updateProduct(productId, data) {
            try {
                await db.collection('products').doc(productId).update(data);
                console.log("✅ Product updated:", productId);
                return true;
            } catch (error) {
                console.error("❌ Error updating product:", error);
                return false;
            }
        }

        // ============================================
        // SAVE ISSUING RECORD
        // ============================================
        async function saveIssuing(data) {
            try {
                const docRef = await db.collection('stockIssuing').add({
                    ...data,
                    date: new Date().toISOString(),
                    status: 'Pending'
                });
                console.log("✅ Issuing saved:", docRef.id);
                return docRef.id;
            } catch (error) {
                console.error("❌ Error saving issuing:", error);
                return null;
            }
        }

        // ============================================
        // GENERATE SEQUENCED REQUEST NUMBER
        // ============================================
        async function generateRequestNumber(department) {
            // Define department codes
            const deptCodes = {
                'Kitchen': 'KIT',
                'Store': 'STR',
                'Office': 'OFC',
                'Production': 'PRD',
                'Warehouse': 'WRH',
                'Other': 'OTH'
            };

            const prefix = deptCodes[department] || 'OTH';
            const companyId = getCurrentCompanyId();

            try {
                // Query existing requests for this department and company to find the highest sequence
                const snapshot = await db.collection('stockIssuing')
                    .where('companyId', '==', companyId)
                    .where('department', '==', department)
                    .get();

                let highestSequence = 1100; // Starting number (e.g., 1100)

                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.requestNumber && data.requestNumber.includes('-')) {
                        const seqPart = parseInt(data.requestNumber.split('-')[1]);
                        if (!isNaN(seqPart) && seqPart > highestSequence) {
                            highestSequence = seqPart;
                        }
                    }
                });

                // Increment by 1
                const newSequence = highestSequence + 1;
                return `${prefix}-${newSequence}`;

            } catch (error) {
                console.error("Error generating request number:", error);
                // Fallback if query fails
                return `${prefix}-${Math.floor(Math.random() * 9000) + 1000}`;
            }
        }
    </script>
</head>
<body>
    <div class="form-container">
        <div class="form-box">
            <div class="form-header">
                <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
                <h1>📤 Issue Stock</h1>
                <p>Record stock being issued</p>
            </div>

            <form id="issueStockForm">
                <!-- Department -->
                <div class="form-group">
                    <label>Department *</label>
                    <select id="issueDepartment" required>
                        <option value="">Select department</option>
                        <option value="Kitchen">Kitchen</option>
                        <option value="Store">Store</option>
                        <option value="Office">Office</option>
                        <option value="Production">Production</option>
                        <option value="Warehouse">Warehouse</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Request Number (Auto-generated) -->
                <div class="form-group">
                    <label>Request Number</label>
                    <input type="text" id="requestNumber" placeholder="Select a department first..." readonly style="background:#f0f0f0;cursor:not-allowed;">
                    <p style="font-size:0.75rem;color:#888;margin-top:3px;">Auto-generated based on department</p>
                </div>

                <!-- Product Selector -->
                <div class="form-group">
                    <label>Product *</label>
                    <select id="issueProduct" required>
                        <option value="">Select product</option>
                    </select>
                </div>

                <!-- Quantity and Approver -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Quantity Issued *</label>
                        <input type="number" id="issueQuantity" placeholder="0" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Approved By *</label>
                        <input type="text" id="approvedBy" placeholder="Approver name" required>
                    </div>
                </div>

                <!-- Remarks -->
                <div class="form-group">
                    <label>Remarks</label>
                    <textarea id="issueRemarks" rows="2" placeholder="Add remarks..."></textarea>
                </div>

                <button type="submit" class="btn-submit">✅ Submit Issue</button>
            </form>
        </div>
    </div>

    <script>
        let allProducts = [];

        // ============================================
        // LOAD PRODUCTS ON PAGE LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                allProducts = await getProducts();
                const select = document.getElementById('issueProduct');
                
                if (select) {
                    select.innerHTML = '<option value="">Select product</option>';
                    allProducts.forEach(product => {
                        const option = document.createElement('option');
                        option.value = product.id;
                        option.textContent = `${product.name} (${product.quantity || 0} in stock)`;
                        option.dataset.qty = product.quantity || 0;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading products:', error);
                alert('❌ Error loading products. Please refresh the page.');
            }
        });

        // ============================================
        // AUTO-GENERATE REQUEST NUMBER ON DEPARTMENT CHANGE
        // ============================================
        document.getElementById('issueDepartment').addEventListener('change', async function() {
            const department = this.value;
            const requestNumberField = document.getElementById('requestNumber');

            if (department) {
                requestNumberField.value = '⏳ Generating...';
                const generatedNumber = await generateRequestNumber(department);
                requestNumberField.value = generatedNumber;
            } else {
                requestNumberField.value = '';
            }
        });

        // ============================================
        // HANDLE FORM SUBMISSION
        // ============================================
        document.getElementById('issueStockForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const department = document.getElementById('issueDepartment').value;
            const requestNumber = document.getElementById('requestNumber').value;
            const productId = document.getElementById('issueProduct').value;
            const qty = parseInt(document.getElementById('issueQuantity').value);
            const approvedBy = document.getElementById('approvedBy').value;
            const remarks = document.getElementById('issueRemarks').value;
            const companyId = getCurrentCompanyId();

            // Validation
            if (!department || !productId || !qty || !approvedBy) {
                alert('❌ Please fill in all required fields');
                return;
            }

            if (!requestNumber || requestNumber === '⏳ Generating...') {
                alert('❌ Request number is still generating. Please wait a moment.');
                return;
            }

            const product = allProducts.find(p => p.id === productId);
            if (!product) {
                alert('❌ Product not found');
                return;
            }

            if (qty > (product.quantity || 0)) {
                alert(`❌ Not enough stock! Available: ${product.quantity || 0}`);
                return;
            }

            // Proceed with issuing
            try {
                // 1. Save issuing record
                await saveIssuing({
                    department: department,
                    requestNumber: requestNumber,
                    product: product.name,
                    productId: productId,
                    quantity: qty,
                    approvedBy: approvedBy,
                    remarks: remarks,
                    issuedBy: JSON.parse(localStorage.getItem('currentUser'))?.name || 'System',
                    companyId: companyId
                });

                // 2. Deduct product quantity
                const newQty = (product.quantity || 0) - qty;
                await updateProduct(productId, { quantity: newQty });

                // 3. Show success
                alert(`✅ Stock issued successfully!\n\n📦 Product: ${product.name}\n📊 Quantity: ${qty}\n🏢 Department: ${department}\n🔢 Request #: ${requestNumber}\n\n🔄 Inventory updated! Remaining stock: ${newQty}`);
                
                // 4. Reset form
                this.reset();
                document.getElementById('requestNumber').value = '';
                
                // 5. Reload products to reflect new quantities
                allProducts = await getProducts();
                const select = document.getElementById('issueProduct');
                select.innerHTML = '<option value="">Select product</option>';
                allProducts.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = `${product.name} (${product.quantity || 0} in stock)`;
                    option.dataset.qty = product.quantity || 0;
                    select.appendChild(option);
                });

            } catch (error) {
                console.error('Error issuing stock:', error);
                alert('❌ Error issuing stock. Please try again.');
            }
        });
    </script>
</body>
</html>
