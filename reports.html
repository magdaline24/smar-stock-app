<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stock - Reports</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <div class="form-box">
            <div class="form-header">
                <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
                <h1>📄 Generate Report</h1>
                <p>Create inventory reports</p>
            </div>

            <form id="reportForm">
                <div class="form-group">
                    <label>Report Type *</label>
                    <select id="reportType" required>
                        <option value="">Select Report Type</option>
                        <option value="inventory">📦 Inventory Summary</option>
                        <option value="transactions">🔄 Transaction History</option>
                        <option value="alerts">⚠️ Alerts Report</option>
                        <option value="suppliers">🚚 Supplier Report</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>From Date</label>
                        <input type="date" id="fromDate">
                    </div>
                    <div class="form-group">
                        <label>To Date</label>
                        <input type="date" id="toDate">
                    </div>
                </div>

                <button type="submit" class="btn-submit">📊 Generate Report</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const type = document.getElementById('reportType').value;
            const from = document.getElementById('fromDate').value || 'N/A';
            const to = document.getElementById('toDate').value || 'N/A';
            
            const typeNames = {
                'inventory': '📦 Inventory Summary',
                'transactions': '🔄 Transaction History',
                'alerts': '⚠️ Alerts Report',
                'suppliers': '🚚 Supplier Report'
            };
            
            alert(`📊 Report Generated!\n\n📌 Type: ${typeNames[type]}\n📅 From: ${from}\n📅 To: ${to}\n\n✅ Report is ready for download!`);
            
            this.reset();
        });
    </script>
</body>
</html>
