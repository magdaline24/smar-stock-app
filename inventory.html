<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stock - Inventory</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <script src="/sw-register.js"></script>
    <script src="offline-sync.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwcI_RRe3nRS8ZLxExsyyT4PDdtv5g4kg",
            authDomain: "smart-stock-app-da50f.firebaseapp.com",
            projectId: "smart-stock-app-da50f",
            storageBucket: "smart-stock-app-da50f.appspot.com",
            messagingSenderId: "512981075308",
            appId: "1:512981075308:web:491c04288f19aa26775f49",
            measurementId: "G-QPCK6Q566V"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log("🔥 Firebase connected!");

        // Get All Products (Filtered by Company)
async function getProducts() {
    try {
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const companyId = currentUser?.companyId || 'default';
        
        const snapshot = await db.collection('products')
            .where('companyId', '==', companyId)
            .get();
        const products = [];
        snapshot.forEach(doc => {
            products.push({ id: doc.id, ...doc.data() });
        });
        return products;
    } catch (error) {
        console.error("❌ Error getting products:", error);
        return [];
    }
}

        async function deleteProduct(productId) {
            try {
                await db.collection('products').doc(productId).delete();
                console.log("✅ Product deleted:", productId);
                return true;
            } catch (error) {
                console.error("❌ Error deleting product:", error);
                return false;
            }
        }
    </script>
</head>
<body>
    <div class="form-container" style="max-width: 100%; padding: 10px;">
        <div class="form-box" style="max-width: 100%; padding: 15px;">
            <div class="form-header">
                <a href="dashboard.html" class="back-btn">← Back</a>
                <h1>📦 Inventory</h1>
                <p>Manage your products</p>
            </div>

            <!-- Search and Filter -->
            <div style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;">
                <input type="text" id="searchInventory" placeholder="🔍 Search products..." style="flex: 2; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif; min-width: 120px;">
                <select id="filterCategory" style="flex: 1; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif; min-width: 100px;">
                    <option value="all">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Medicine">Medicine</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                </select>
                <a href="add-item.html" style="padding: 10px 15px; background: #667eea; color: white; border: none; border-radius: 8px; text-decoration: none; font-family: 'Poppins', sans-serif; white-space: nowrap;">➕ Add</a>
            </div>

            <!-- Product Grid -->
            <div id="productGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px;">
                <!-- Products will be loaded here -->
            </div>

            <div style="text-align: center; margin-top: 15px; color: #888; font-size: 0.85rem;">
                <span id="productCount">0</span> products
            </div>
        </div>
    </div>

    <style>
        .product-card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }
        .product-card .product-image {
            width: 100%;
            height: 100px;
            background: #f8f9ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .product-card .product-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-card .product-category {
            font-size: 0.7rem;
            color: #888;
            background: #f0f2ff;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .product-card .product-qty {
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 5px;
        }
        .product-card .product-qty.low {
            color: #ef4444;
        }
        .product-card .product-qty.in-stock {
            color: #22c55e;
        }
        .product-card .product-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .product-card .product-actions button {
            flex: 1;
            padding: 4px 8px;
            border: none;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .btn-edit {
            background: #667eea;
            color: white;
        }
        .btn-delete {
            background: #fee2e2;
            color: #ef4444;
        }
        .btn-barcode {
            background: #f0f2ff;
            color: #667eea;
        }
        .badge-low {
            background: #fee2e2;
            color: #ef4444;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
        }
        .badge-instock {
            background: #dcfce7;
            color: #22c55e;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .product-card .product-image {
                height: 80px;
                font-size: 2rem;
            }
        }
    </style>

    <script>
        let allProducts = [];

        async function loadProducts() {
            allProducts = await getProducts();
            renderProducts();
        }

        function renderProducts() {
            const search = document.getElementById('searchInventory')?.value.toLowerCase() || '';
            const category = document.getElementById('filterCategory')?.value || 'all';

            let filtered = allProducts;
            if (search) {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
            }
            if (category !== 'all') {
                filtered = filtered.filter(p => p.category === category);
            }

            const grid = document.getElementById('productGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #999;">
                        <span style="font-size: 3rem;">📭</span>
                        <p>No products found</p>
                        <a href="add-item.html" style="color: #667eea; text-decoration: none;">+ Add a product</a>
                    </div>
                `;
            } else {
                grid.innerHTML = filtered.map(p => `
                    <div class="product-card">
                        <div class="product-image">${p.image || '📦'}</div>
                        <div class="product-name">${p.name || 'Unnamed'}</div>
                        <span class="product-category">${p.category || 'Uncategorized'}</span>
                        <div class="product-qty ${(p.quantity || 0) < 10 ? 'low' : 'in-stock'}">
                            ${p.quantity || 0} units
                            ${(p.quantity || 0) < 10 ? '<span class="badge-low">⚠️ Low</span>' : '<span class="badge-instock">✅ In Stock</span>'}
                        </div>
                        ${p.expiryDate ? `<div style="font-size:0.65rem;color:#888;">Exp: ${new Date(p.expiryDate).toLocaleDateString()}</div>` : ''}
                        ${p.barcode ? `<div style="font-size:0.6rem;color:#999;">🔲 ${p.barcode}</div>` : ''}
                        <div class="product-actions">
    <button class="btn-barcode" onclick="viewBarcode('${p.id}')">🔲</button>
    <button class="btn-scan" onclick="scanProduct('${p.id}')">📷</button>
    <button class="btn-edit" onclick="editProduct('${p.id}')">✏️</button>
    <button class="btn-delete" onclick="deleteProductById('${p.id}')">🗑️</button>
</div>
                `).join('');
            }

            document.getElementById('productCount').textContent = filtered.length;
        }

        async function deleteProductById(productId) {
            if (confirm('⚠️ Are you sure you want to delete this product?')) {
                const success = await deleteProduct(productId);
                if (success) {
                    alert('✅ Product deleted!');
                    await loadProducts();
                } else {
                    alert('❌ Error deleting product');
                }
            }
        }

        function editProduct(productId) {
            window.location.href = `add-item.html?edit=${productId}`;
        }

        function viewBarcode(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (product) {
                alert(`🔲 Barcode for ${product.name}\n\n📦 ${product.barcode || 'No barcode assigned'}\n\nScan this to identify the product.`);
            }
        }

        document.getElementById('searchInventory')?.addEventListener('input', renderProducts);
        document.getElementById('filterCategory')?.addEventListener('change', renderProducts);

        document.addEventListener('DOMContentLoaded', loadProducts);
        function scanProduct(productId) {
    // Go to barcode scanner with product ID
    window.location.href = `barcode-scanner.html?product=${productId}`;
}
    </script>
</body>
</html>
