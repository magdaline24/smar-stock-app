<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stock - Stock Count</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <script src="sw-register.js"></script>
    <script src="offline-sync.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwcI_RRe3nRS8ZLxExsyyT4PDdtv5g4kg",
            authDomain: "smart-stock-app-da50f.firebaseapp.com",
            projectId: "smart-stock-app-da50f",
            storageBucket: "smart-stock-app-da50f.appspot.com",
            messagingSenderId: "512981075308",
            appId: "1:512981075308:web:491c04288f19aa26775f49",
            measurementId: "G-QPCK6Q566V"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log("🔥 Firebase connected!");

        // ============================================
        // GET CURRENT COMPANY ID
        // ============================================
        function getCurrentCompanyId() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            return currentUser?.companyId || 'default';
        }

        // ============================================
        // GET PRODUCTS (FILTERED BY COMPANY)
        // ============================================
        async function getProducts() {
            try {
                const companyId = getCurrentCompanyId();
                const snapshot = await db.collection('products')
                    .where('companyId', '==', companyId)
                    .get();
                const products = [];
                snapshot.forEach(doc => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                return products;
            } catch (error) {
                console.error("❌ Error getting products:", error);
                return [];
            }
        }

        // ============================================
        // GET PREVIOUS COUNTS
        // ============================================
        async function getStockCounts() {
            try {
                const companyId = getCurrentCompanyId();
                const snapshot = await db.collection('stockCounts')
                    .where('companyId', '==', companyId)
                    .orderBy('date', 'desc')
                    .limit(15)
                    .get();
                const counts = [];
                snapshot.forEach(doc => {
                    counts.push({ id: doc.id, ...doc.data() });
                });
                return counts;
            } catch (error) {
                console.error("❌ Error getting counts:", error);
                return [];
            }
        }

        // ============================================
        // UPDATE PRODUCT QUANTITY (THE SYNC PART!)
        // ============================================
        async function updateProductQuantity(productId, newQuantity) {
            try {
                await db.collection('products').doc(productId).update({
                    quantity: newQuantity
                });
                console.log("✅ Inventory synced for product:", productId, "New Qty:", newQuantity);
                return true;
            } catch (error) {
                console.error("❌ Error updating inventory:", error);
                return false;
            }
        }

        // ============================================
        // SAVE STOCK COUNT
        // ============================================
        async function saveStockCount(data) {
            try {
                const companyId = getCurrentCompanyId();
                const docRef = await db.collection('stockCounts').add({
                    ...data,
                    companyId: companyId,
                    date: new Date().toISOString()
                });
                console.log("✅ Stock count saved:", docRef.id);
                return docRef.id;
            } catch (error) {
                console.error("❌ Error saving count:", error);
                return null;
            }
        }
    </script>
</head>
<body>
    <div class="form-container">
        <div class="form-box" style="max-width: 600px;">
            <div class="form-header">
                <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
                <h1>📋 Stock Count</h1>
                <p>Count and synchronize your inventory</p>
            </div>

            <!-- ===== NEW STOCK COUNT FORM ===== -->
            <div style="background: #f8f9ff; border-radius: 12px; padding: 20px; margin-bottom: 25px; border: 1px solid #e0e0e0;">
                <h3 style="margin: 0 0 15px; font-size: 1.1rem; color: #333;">📝 New Count</h3>
                
                <form id="stockCountForm">
                    <div class="form-group">
                        <label>Search Item *</label>
                        <select id="countItem" required style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                            <option value="">Select an item</option>
                            <!-- Products loaded here -->
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Expected Quantity</label>
                            <input type="number" id="expectedQty" placeholder="0" readonly style="background: #e9ecef; cursor: not-allowed;">
                        </div>
                        <div class="form-group">
                            <label>Actual Count *</label>
                            <input type="number" id="actualQty" placeholder="0" min="0" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Remarks</label>
                        <input type="text" id="countRemarks" placeholder="e.g., 2 damaged, 1 expired..." style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                    </div>

                    <div class="form-group">
                        <label>Counted By *</label>
                        <input type="text" id="countedBy" placeholder="Your name" required style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                    </div>

                    <button type="submit" class="btn-submit">💾 Save & Sync Count</button>
                </form>
            </div>

            <!-- ===== PREVIOUS COUNTS ===== -->
            <div>
                <h3 style="margin: 0 0 15px; font-size: 1.1rem; color: #333;">📊 Previous Counts</h3>
                <div id="previousCounts" style="max-height: 350px; overflow-y: auto;">
                    <div style="text-align:center;padding:20px;color:#999;">Loading history...</div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .count-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .count-card h4 {
            margin: 0 0 5px;
            font-size: 1rem;
            color: #333;
        }
        .count-details {
            font-size: 0.85rem;
            color: #666;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .count-footer {
            font-size: 0.75rem;
            color: #999;
            border-top: 1px dashed #eee;
            padding-top: 8px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
        .variance-badge {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .variance-match { background: #dcfce7; color: #22c55e; }
        .variance-missing { background: #fee2e2; color: #ef4444; }
        .variance-extra { background: #eff6ff; color: #3b82f6; }
    </style>

    <script>
        let allProducts = [];

        // ============================================
        // INITIALIZE PAGE
        // ============================================
        document.addEventListener('DOMContentLoaded', async function() {
            // 1. Load Products
            allProducts = await getProducts();
            const select = document.getElementById('countItem');
            
            if (select) {
                select.innerHTML = '<option value="">Select an item to count...</option>';
                allProducts.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = `${product.name} (System: ${product.quantity || 0})`;
                    select.appendChild(option);
                });
            }

            // 2. Load Previous Counts
            await loadPreviousCounts();
        });

        // ============================================
        // AUTO-FILL EXPECTED QUANTITY
        // ============================================
        document.getElementById('countItem').addEventListener('change', function() {
            const productId = this.value;
            const product = allProducts.find(p => p.id === productId);
            
            const expectedField = document.getElementById('expectedQty');
            const actualField = document.getElementById('actualQty');

            if (product) {
                expectedField.value = product.quantity || 0;
                actualField.value = ''; // clear actual field so they type fresh
                actualField.focus();
            } else {
                expectedField.value = '';
                actualField.value = '';
            }
        });

        // ============================================
        // HANDLE FORM SUBMISSION (THE SYNC)
        // ============================================
        document.getElementById('stockCountForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const productId = document.getElementById('countItem').value;
            const expected = parseInt(document.getElementById('expectedQty').value) || 0;
            const actual = parseInt(document.getElementById('actualQty').value);
            const remarks = document.getElementById('countRemarks').value || 'N/A';
            const countedBy = document.getElementById('countedBy').value;

            // Validation
            if (!productId) {
                alert('❌ Please select an item');
                return;
            }
            if (isNaN(actual) || actual < 0) {
                alert('❌ Please enter a valid actual count');
                return;
            }
            if (!countedBy) {
                alert('❌ Please enter who is counting');
                return;
            }

            const product = allProducts.find(p => p.id === productId);
            const variance = actual - expected;
            
            let status = 'Match';
            if (variance < 0) status = `${variance} missing`;
            if (variance > 0) status = `+${variance} extra`;

            // 1. Save the count log
            const countId = await saveStockCount({
                item: product.name,
                productId: productId,
                expectedQty: expected,
                actualQty: actual,
                variance: variance,
                status: status,
                remarks: remarks,
                countedBy: countedBy
            });

            if (countId) {
                // 2. SYNC THE INVENTORY! Update the main product quantity to match actual
                await updateProductQuantity(productId, actual);

                // 3. Show success and explain what happened
                let successMsg = `✅ Count Saved & Inventory Synced!\n\n📦 ${product.name}\n📊 System: ${expected} ➡️ Actual: ${actual}\n`;
                if (variance < 0) successMsg += `\n⚠️ ${Math.abs(variance)} items were marked as missing. Inventory updated to ${actual}.`;
                if (variance > 0) successMsg += `\n📈 ${variance} extra items found. Inventory updated to ${actual}.`;
                if (variance === 0) successMsg += `\n✅ Inventory perfectly matches!`;

                alert(successMsg);

                // 4. Reset form and reload UI
                this.reset();
                document.getElementById('expectedQty').value = '';
                
                // Reload products with new quantities
                allProducts = await getProducts();
                const select = document.getElementById('countItem');
                select.innerHTML = '<option value="">Select an item to count...</option>';
                allProducts.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `${p.name} (System: ${p.quantity || 0})`;
                    select.appendChild(opt);
                });

                // Reload history
                await loadPreviousCounts();
            } else {
                alert('❌ Error saving stock count. Please try again.');
            }
        });

        // ============================================
        // LOAD PREVIOUS COUNTS
        // ============================================
        async function loadPreviousCounts() {
            const counts = await getStockCounts();
            const container = document.getElementById('previousCounts');
            
            if (counts.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">No previous counts</div>';
                return;
            }

            container.innerHTML = counts.map(c => {
                let badgeClass = 'variance-match';
                if (c.variance < 0) badgeClass = 'variance-missing';
                if (c.variance > 0) badgeClass = 'variance-extra';

                return `
                    <div class="count-card">
                        <h4>${c.item}</h4>
                        <div class="count-details">
                            <span>System: <strong>${c.expectedQty}</strong></span>
                            <span>Actual: <strong>${c.actualQty}</strong></span>
                            <span class="variance-badge ${badgeClass}">${c.status}</span>
                        </div>
                        ${c.remarks && c.remarks !== 'N/A' ? `<div style="font-size:0.8rem;color:#666;margin-bottom:5px;">📝 ${c.remarks}</div>` : ''}
                        <div class="count-footer">
                            <span>👤 ${c.countedBy}</span>
                            <span>📅 ${new Date(c.date).toLocaleDateString()}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
