<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stock - Stock Count</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    <script src="sw-register.js"></script>
    <script src="offline-sync.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwcI_RRe3nRS8ZLxExsyyT4PDdtv5g4kg",
            authDomain: "smart-stock-app-da50f.firebaseapp.com",
            projectId: "smart-stock-app-da50f",
            storageBucket: "smart-stock-app-da50f.appspot.com",
            messagingSenderId: "512981075308",
            appId: "1:512981075308:web:491c04288f19aa26775f49"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Get User Company
        function getCurrentCompanyId() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            return currentUser?.companyId || 'default';
        }

        // Get Products
        async function getProducts() {
            const companyId = getCurrentCompanyId();
            const snapshot = await db.collection('products').where('companyId', '==', companyId).get();
            const products = [];
            snapshot.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
            return products;
        }

        // Update Product Qty
        async function updateProductQty(productId, newQty) {
            await db.collection('products').doc(productId).update({ quantity: newQty });
        }

        // Get Previous Counts (NO ORDER BY - FIXED ERROR)
        async function getStockCounts() {
            const companyId = getCurrentCompanyId();
            // We removed .orderBy('date', 'desc') to prevent the Firebase Index error
            const snapshot = await db.collection('stockCounts')
                .where('companyId', '==', companyId)
                .get();
            
            const counts = [];
            snapshot.forEach(doc => counts.push({ id: doc.id, ...doc.data() }));
            
            // Sort manually in JavaScript (Newest first)
            counts.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            return counts;
        }
    </script>
</head>
<body>
    <div class="form-container" style="max-width:100%;padding:10px;">
        <div class="form-box" style="max-width:100%;padding:15px;">
            <div class="form-header">
                <a href="dashboard.html" class="back-btn">← Back</a>
                <h1>📋 Stock Count</h1>
                <p>Count and verify your inventory</p>
            </div>

            <!-- New Stock Count -->
            <div style="background: #f8f9ff; border-radius: 12px; padding: 15px; margin-bottom: 15px;">
                <h3 style="margin: 0 0 10px;">📝 New Stock Count</h3>
                
                <div class="form-group">
                    <label>Search Item</label>
                    <select id="countItem" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                        <option value="">Select an item</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Expected Quantity</label>
                        <input type="number" id="expectedQty" readonly style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; background:#f0f0f0;">
                    </div>
                    <div class="form-group">
                        <label>Actual Count</label>
                        <input type="number" id="actualQty" placeholder="0" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;">
                    </div>
                </div>

                <div class="form-group">
                    <label>Remarks</label>
                    <input type="text" id="countRemarks" placeholder="Add remarks..." style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;">
                </div>

                <div class="form-group">
                    <label>Counted By</label>
                    <input type="text" id="countedBy" placeholder="Your name" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;">
                </div>

                <button id="saveCountBtn" style="width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif;">💾 Save Count & Update Inventory</button>
            </div>

            <!-- Previous Counts -->
            <div>
                <h3 style="margin: 0 0 10px;">📊 Previous Counts</h3>
                <div id="previousCounts" style="max-height: 400px; overflow-y: auto;">
                    <!-- Counts load here -->
                </div>
            </div>
        </div>
    </div>

    <style>
        .count-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .count-item .item-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 5px;
        }
        .count-item .count-info {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }
        .count-item .variance {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .variance.match { color: #22c55e; }
        .variance.missing { color: #ef4444; }
        .variance.extra { color: #f59e0b; }
    </style>

    <script>
        let allProducts = [];

        // Load Data on Start
        document.addEventListener('DOMContentLoaded', async () => {
            allProducts = await getProducts();
            
            // Populate Dropdown
            const select = document.getElementById('countItem');
            allProducts.forEach(p => {
                select.innerHTML += `<option value="${p.id}" data-qty="${p.quantity || 0}">${p.name}</option>`;
            });

            // Load previous counts
            await loadPreviousCounts();
        });

        // Auto-fill Expected Qty
        document.getElementById('countItem').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            if (this.value) {
                document.getElementById('expectedQty').value = selectedOption.dataset.qty;
            } else {
                document.getElementById('expectedQty').value = '';
            }
        });

        // Save Count & Update Inventory
        document.getElementById('saveCountBtn').addEventListener('click', async function() {
            const productId = document.getElementById('countItem').value;
            const expected = parseInt(document.getElementById('expectedQty').value) || 0;
            const actual = parseInt(document.getElementById('actualQty').value);
            const remarks = document.getElementById('countRemarks').value;
            const countedBy = document.getElementById('countedBy').value;

            if (!productId) return alert('Please select an item');
            if (isNaN(actual)) return alert('Please enter the actual count');
            if (!countedBy) return alert('Please enter who is counting');

            const product = allProducts.find(p => p.id === productId);
            const variance = actual - expected;
            let statusText = variance === 0 ? 'Match' : variance > 0 ? `+${variance} extra` : `${variance} missing`;

            try {
                // 1. Save the Count Log
                await db.collection('stockCounts').add({
                    companyId: getCurrentCompanyId(),
                    item: product.name,
                    productId: productId,
                    expectedQty: expected,
                    actualQty: actual,
                    variance: variance,
                    status: statusText,
                    remarks: remarks,
                    countedBy: countedBy,
                    date: new Date().toISOString()
                });

                // 2. UPDATE THE INVENTORY (The magic part!)
                await updateProductQty(productId, actual);

                alert(`✅ Stock Count saved!\n📦 ${product.name}\nInventory automatically updated to: ${actual}`);

                // 3. Reload the page to show new data
                window.location.reload();

            } catch (error) {
                console.error('Error saving count:', error);
                alert('❌ Error saving stock count: ' + error.message);
            }
        });

        // Render Previous Counts
        async function loadPreviousCounts() {
            const counts = await getStockCounts();
            const container = document.getElementById('previousCounts');
            
            if (counts.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">No previous counts</div>';
                return;
            }

            container.innerHTML = counts.map(c => {
                let varClass = 'match';
                let varText = 'Match';
                if (c.variance > 0) { varClass = 'extra'; varText = `▲ +${c.variance} extra`; }
                if (c.variance < 0) { varClass = 'missing'; varText = `⚠️ ${Math.abs(c.variance)} missing`; }

                return `
                    <div class="count-item">
                        <div class="item-name">${c.item}</div>
                        <div class="count-info">Expected: <b>${c.expectedQty}</b> | Actual: <b>${c.actualQty}</b></div>
                        <div class="variance ${varClass}">${varText}</div>
                        <div style="font-size: 0.75rem; color: #999; margin-top: 5px;">
                            By: ${c.countedBy} | ${new Date(c.date).toLocaleDateString()}
                        </div>
                        ${c.remarks ? `<div style="font-size:0.8rem; font-style:italic; color:#666; margin-top:5px;">"${c.remarks}"</div>` : ''}
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
