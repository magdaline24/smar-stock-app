<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stock - Stock Count</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <script src="sw-register.js"></script>
    <script src="offline-sync.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="resend-functions.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwcI_RRe3nRS8ZLxExsyyT4PDdtv5g4kg",
            authDomain: "smart-stock-app-da50f.firebaseapp.com",
            projectId: "smart-stock-app-da50f",
            storageBucket: "smart-stock-app-da50f.appspot.com",
            messagingSenderId: "512981075308",
            appId: "1:512981075308:web:491c04288f19aa26775f49",
            measurementId: "G-QPCK6Q566V"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log("🔥 Firebase connected!");

        // Get All Products (Filtered by Company)
async function getProducts() {
    try {
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const companyId = currentUser?.companyId || 'default';
        
        const snapshot = await db.collection('products')
            .where('companyId', '==', companyId)
            .get();
        const products = [];
        snapshot.forEach(doc => {
            products.push({ id: doc.id, ...doc.data() });
        });
        return products;
    } catch (error) {
        console.error("❌ Error getting products:", error);
        return [];
    }
}

        async function getStockCounts() {
            try {
                const snapshot = await db.collection('stockCounts')
                    .orderBy('date', 'desc')
                    .get();
                const counts = [];
                snapshot.forEach(doc => {
                    counts.push({ id: doc.id, ...doc.data() });
                });
                return counts;
            } catch (error) {
                console.error("❌ Error:", error);
                return [];
            }
        }

        async function saveStockCount(data) {
            try {
                const docRef = await db.collection('stockCounts').add({
                    ...data,
                    date: new Date().toISOString()
                });
                console.log("✅ Stock count saved:", docRef.id);
                return docRef.id;
            } catch (error) {
                console.error("❌ Error saving stock count:", error);
                return null;
            }
        }
    </script>
</head>
<body>
    <div class="form-container" style="max-width: 100%; padding: 10px;">
        <div class="form-box" style="max-width: 100%; padding: 15px;">
            <div class="form-header">
                <a href="dashboard.html" class="back-btn">← Back</a>
                <h1>📋 Stock Count</h1>
                <p>Count and verify your inventory</p>
            </div>

            <!-- New Stock Count -->
            <div style="background: #f8f9ff; border-radius: 12px; padding: 15px; margin-bottom: 15px;">
                <h3 style="margin: 0 0 10px;">📝 New Stock Count</h3>
                <div class="form-group">
                    <label>Search Item</label>
                    <select id="countItem" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                        <option value="">Select an item</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Expected Quantity</label>
                        <input type="number" id="expectedQty" placeholder="0" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                    </div>
                    <div class="form-group">
                        <label>Actual Count</label>
                        <input type="number" id="actualQty" placeholder="0" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Remarks</label>
                    <input type="text" id="countRemarks" placeholder="Add remarks..." style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <div class="form-group">
                    <label>Counted By</label>
                    <input type="text" id="countedBy" placeholder="Your name" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <button id="saveCountBtn" style="width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif;">💾 Save Count</button>
            </div>

            <!-- Previous Counts -->
            <div>
                <h3 style="margin: 0 0 10px;">📊 Previous Counts</h3>
                <div id="previousCounts" style="max-height: 300px; overflow-y: auto;">
                    <!-- Counts will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <style>
        .count-item {
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .count-item .count-info {
            flex: 1;
        }
        .count-item .count-info strong {
            display: block;
        }
        .count-item .count-info span {
            font-size: 0.8rem;
            color: #888;
        }
        .count-item .count-status {
            font-weight: 600;
            font-size: 0.8rem;
        }
        .count-item .count-status.match {
            color: #22c55e;
        }
        .count-item .count-status.mismatch {
            color: #ef4444;
        }
    </style>

    <script>
        let allProducts = [];

        async function loadProducts() {
            allProducts = await getProducts();
            const select = document.getElementById('countItem');
            select.innerHTML = '<option value="">Select an item</option>' +
                allProducts.map(p => `<option value="${p.id}">${p.name} (${p.quantity || 0} in stock)</option>`).join('');
        }

        document.getElementById('countItem').addEventListener('change', function() {
            const product = allProducts.find(p => p.id === this.value);
            if (product) {
                document.getElementById('expectedQty').value = product.quantity || 0;
            } else {
                document.getElementById('expectedQty').value = '';
            }
        });

        document.getElementById('saveCountBtn').addEventListener('click', async function() {
            const productId = document.getElementById('countItem').value;
            const expected = parseInt(document.getElementById('expectedQty').value) || 0;
            const actual = parseInt(document.getElementById('actualQty').value) || 0;
            const remarks = document.getElementById('countRemarks').value || '';
            const countedBy = document.getElementById('countedBy').value || 'Anonymous';

            if (!productId) {
                alert('Please select an item');
                return;
            }
            if (actual === 0) {
                alert('Please enter the actual count');
                return;
            }

            const product = allProducts.find(p => p.id === productId);
            const variance = actual - expected;
            const status = variance === 0 ? 'Match' : variance > 0 ? `+${variance} extra` : `${variance} missing`;

            const result = await saveStockCount({
                item: product.name,
                productId: productId,
                expectedQty: expected,
                actualQty: actual,
                variance: variance,
                remarks: remarks,
                countedBy: countedBy,
                status: status
            });

            if (result) {
                alert(`✅ Stock count saved!\n\n📦 ${product.name}\n📊 Expected: ${expected}\n📊 Actual: ${actual}\n📌 Status: ${status}`);
                document.getElementById('countItem').value = '';
                document.getElementById('expectedQty').value = '';
                document.getElementById('actualQty').value = '';
                document.getElementById('countRemarks').value = '';
                document.getElementById('countedBy').value = '';
                await loadPreviousCounts();
            } else {
                alert('❌ Error saving stock count');
            }
        });

        async function loadPreviousCounts() {
            const counts = await getStockCounts();
            const container = document.getElementById('previousCounts');
            if (counts.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">No previous counts</div>';
            } else {
                container.innerHTML = counts.slice(0, 10).map(c => `
                    <div class="count-item">
                        <div class="count-info">
                            <strong>${c.item || 'N/A'}</strong>
                            <span>Expected: ${c.expectedQty || 0} | Actual: ${c.actualQty || 0}</span>
                            <span>By: ${c.countedBy || 'Anonymous'} | ${new Date(c.date).toLocaleDateString()}</span>
                        </div>
                        <div class="count-status ${c.variance === 0 ? 'match' : 'mismatch'}">
                            ${c.variance === 0 ? '✅ Match' : `⚠️ ${c.status || 'Mismatch'}`}
                        </div>
                    </div>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            await loadProducts();
            await loadPreviousCounts();
        });
    </script>
</body>
</html>
