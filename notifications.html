<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stock - Notifications</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <script src="sw-register.js"></script>
    <script src="offline-sync.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwcI_RRe3nRS8ZLxExsyyT4PDdtv5g4kg",
            authDomain: "smart-stock-app-da50f.firebaseapp.com",
            projectId: "smart-stock-app-da50f",
            storageBucket: "smart-stock-app-da50f.appspot.com",
            messagingSenderId: "512981075308",
            appId: "1:512981075308:web:491c04288f19aa26775f49",
            measurementId: "G-QPCK6Q566V"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log("🔥 Firebase connected!");

        // ============================================
        // GET CURRENT USER COMPANY
        // ============================================
        function getCurrentCompanyId() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            return currentUser?.companyId || 'default';
        }

        // ============================================
        // GET PRODUCTS BY COMPANY
        // ============================================
        async function getProductsByCompany() {
            try {
                const companyId = getCurrentCompanyId();
                console.log("🔍 Fetching products for company:", companyId);
                
                const snapshot = await db.collection('products')
                    .where('companyId', '==', companyId)
                    .get();
                    
                const products = [];
                snapshot.forEach(doc => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                
                console.log("📦 Products found:", products.length);
                return products;
            } catch (error) {
                console.error("❌ Error getting products:", error);
                return [];
            }
        }

        // ============================================
        // GET NOTIFICATIONS BY COMPANY
        // ============================================
        async function getNotifications() {
            try {
                const companyId = getCurrentCompanyId();
                const notifications = [];
                
                // Get products for this company
                const products = await getProductsByCompany();
                
                // 1. LOW STOCK ALERTS
                const lowStockItems = products.filter(p => (p.quantity || 0) < 10);
                console.log("⚠️ Low stock items:", lowStockItems.length);
                
                lowStockItems.forEach(p => {
                    notifications.push({
                        id: `low-${p.id}`,
                        type: 'low',
                        icon: '🔴',
                        title: `⚠️ Low Stock: ${p.name}`,
                        message: `Only ${p.quantity || 0} units remaining. Please reorder.`,
                        date: new Date().toISOString(),
                        productId: p.id
                    });
                });

                // 2. EXPIRING ALERTS
                const today = new Date();
                const sevenDays = new Date();
                sevenDays.setDate(today.getDate() + 7);
                const expiringItems = products.filter(p => {
                    if (!p.expiryDate) return false;
                    const expiry = new Date(p.expiryDate);
                    return expiry >= today && expiry <= sevenDays;
                });
                console.log("⏰ Expiring items:", expiringItems.length);
                
                expiringItems.forEach(p => {
                    const daysLeft = Math.ceil((new Date(p.expiryDate) - today) / (1000 * 60 * 60 * 24));
                    notifications.push({
                        id: `expiry-${p.id}`,
                        type: 'expiry',
                        icon: '🟡',
                        title: `⏰ Expiring: ${p.name}`,
                        message: `Expires in ${daysLeft} days (${new Date(p.expiryDate).toLocaleDateString()})`,
                        date: p.expiryDate,
                        productId: p.id
                    });
                });

                // 3. OUT OF STOCK ALERTS
                const outOfStockItems = products.filter(p => (p.quantity || 0) === 0);
                console.log("❌ Out of stock items:", outOfStockItems.length);
                
                outOfStockItems.forEach(p => {
                    notifications.push({
                        id: `out-${p.id}`,
                        type: 'out',
                        icon: '❌',
                        title: `❌ Out of Stock: ${p.name}`,
                        message: `This item is completely out of stock!`,
                        date: new Date().toISOString(),
                        productId: p.id
                    });
                });

                // 4. PENDING REQUESTS - FILTERED BY COMPANY
                const pendingSnapshot = await db.collection('stockIssuing')
                    .where('companyId', '==', companyId)
                    .where('status', '==', 'Pending')
                    .get();
                console.log("📝 Pending requests:", pendingSnapshot.size);
                
                pendingSnapshot.forEach(doc => {
                    const data = doc.data();
                    notifications.push({
                        id: `pending-${doc.id}`,
                        type: 'pending',
                        icon: '🔵',
                        title: `📝 Pending Request: ${data.product || 'Item'}`,
                        message: `${data.quantity || 0} units requested by ${data.department || 'Unknown'}`,
                        date: data.date || new Date().toISOString(),
                        requestId: doc.id
                    });
                });

                // 5. RECENT RECEIVING - FILTERED BY COMPANY
                const receivingSnapshot = await db.collection('stockReceiving')
                    .where('companyId', '==', companyId)
                    .orderBy('date', 'desc')
                    .limit(5)
                    .get();
                console.log("📥 Recent receiving:", receivingSnapshot.size);
                
                receivingSnapshot.forEach(doc => {
                    const data = doc.data();
                    notifications.push({
                        id: `received-${doc.id}`,
                        type: 'delivery',
                        icon: '🟢',
                        title: `📥 New Delivery: ${data.product || 'Item'}`,
                        message: `${data.quantity || 0} units received from ${data.supplier || 'Unknown'}`,
                        date: data.date || new Date().toISOString(),
                        receivingId: doc.id
                    });
                });

                // Sort by date (newest first)
                notifications.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                console.log("✅ Total notifications:", notifications.length);
                return notifications;
            } catch (error) {
                console.error('❌ Error getting notifications:', error);
                return [];
            }
        }
    </script>
</head>
<body>
    <div class="form-container" style="max-width:100%;padding:10px;">
        <div class="form-box" style="max-width:100%;padding:15px;">
            <div class="form-header">
                <a href="dashboard.html" class="back-btn">← Back</a>
                <h1>🔔 Notifications</h1>
                <p>Real-time alerts and updates</p>
            </div>

            <!-- Notification Filters -->
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:15px;">
                <button onclick="filterNotifications('all')" style="padding:8px;background:#667eea;color:white;border:none;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:0.75rem;font-weight:500;">📋 All</button>
                <button onclick="filterNotifications('low')" style="padding:8px;background:#ef4444;color:white;border:none;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:0.75rem;font-weight:500;">🔴 Low Stock</button>
                <button onclick="filterNotifications('expiry')" style="padding:8px;background:#f59e0b;color:white;border:none;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:0.75rem;font-weight:500;">🟡 Expiry</button>
                <button onclick="filterNotifications('out')" style="padding:8px;background:#ef4444;color:white;border:none;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:0.75rem;font-weight:500;">❌ Out of Stock</button>
                <button onclick="filterNotifications('pending')" style="padding:8px;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:0.75rem;font-weight:500;">🔵 Pending</button>
                <button onclick="filterNotifications('delivery')" style="padding:8px;background:#22c55e;color:white;border:none;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:0.75rem;font-weight:500;">🟢 Delivery</button>
            </div>

            <!-- Notification Count -->
            <div style="text-align:center;margin-bottom:15px;font-size:0.85rem;color:#888;">
                <span id="notifCount">0</span> notifications
            </div>

            <!-- Notification List -->
            <div id="notificationList" style="max-height:500px;overflow-y:auto;">
                <div style="text-align:center;padding:40px;color:#999;">Loading notifications...</div>
            </div>
        </div>
    </div>

    <style>
        .notif-item {
            background: white;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            cursor: default;
        }
        .notif-item:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .notif-item .notif-content {
            flex: 1;
        }
        .notif-item .notif-content .notif-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .notif-item .notif-content .notif-message {
            font-size: 0.8rem;
            color: #666;
            margin-top: 2px;
        }
        .notif-item .notif-time {
            font-size: 0.65rem;
            color: #999;
            white-space: nowrap;
            margin-left: 10px;
        }
        .notif-item .notif-badge {
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 10px;
        }
        .notif-item .notif-badge.low { background: #fee2e2; color: #ef4444; }
        .notif-item .notif-badge.expiry { background: #fffbeb; color: #f59e0b; }
        .notif-item .notif-badge.out { background: #fee2e2; color: #ef4444; }
        .notif-item .notif-badge.pending { background: #eff6ff; color: #3b82f6; }
        .notif-item .notif-badge.delivery { background: #dcfce7; color: #22c55e; }
        .notif-item.low { border-left-color: #ef4444; }
        .notif-item.expiry { border-left-color: #f59e0b; }
        .notif-item.out { border-left-color: #ef4444; }
        .notif-item.pending { border-left-color: #3b82f6; }
        .notif-item.delivery { border-left-color: #22c55e; }
        
        .notif-empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .notif-empty span {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }
        .filter-active {
            opacity: 1 !important;
        }
    </style>

    <script>
        let allNotifications = [];
        let currentFilter = 'all';

        // ============================================
        // LOAD NOTIFICATIONS
        // ============================================
        async function loadNotifications() {
            try {
                const container = document.getElementById('notificationList');
                const countEl = document.getElementById('notifCount');
                
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">⏳ Loading notifications...</div>';
                
                allNotifications = await getNotifications();
                
                if (countEl) {
                    countEl.textContent = allNotifications.length;
                }
                
                renderNotifications(currentFilter);
            } catch (error) {
                console.error('❌ Error loading notifications:', error);
                document.getElementById('notificationList').innerHTML = `
                    <div class="notif-empty">
                        <span>❌</span>
                        <p>Error loading notifications</p>
                        <button onclick="loadNotifications()" style="padding:8px 20px;background:#667eea;color:white;border:none;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;">Retry</button>
                    </div>
                `;
            }
        }

        // ============================================
        // RENDER NOTIFICATIONS
        // ============================================
        function renderNotifications(filter) {
            const container = document.getElementById('notificationList');
            let filtered = allNotifications;
            
            if (filter !== 'all') {
                filtered = allNotifications.filter(n => n.type === filter);
            }
            
            if (filtered.length === 0) {
                const message = filter === 'all' ? 'No notifications yet' : `No ${filter} notifications`;
                container.innerHTML = `
                    <div class="notif-empty">
                        <span>✅</span>
                        <p>${message}</p>
                        <p style="font-size:0.8rem;color:#bbb;">All systems are good!</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map(n => `
                <div class="notif-item ${n.type}">
                    <div class="notif-content">
                        <div class="notif-title">
                            ${n.icon} ${n.title}
                        </div>
                        <div class="notif-message">${n.message}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <span class="notif-time">${new Date(n.date).toLocaleDateString()}</span>
                        <span class="notif-badge ${n.type}">${n.type.toUpperCase()}</span>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // FILTER NOTIFICATIONS
        // ============================================
        function filterNotifications(type) {
            currentFilter = type;
            renderNotifications(type);
            
            // Update active filter buttons
            document.querySelectorAll('[onclick^="filterNotifications"]').forEach(btn => {
                btn.style.opacity = btn.textContent.trim().toLowerCase().includes(type) ? '1' : '0.5';
            });
        }

        // ============================================
        // LOAD ON PAGE LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadNotifications();
        });
    </script>
</body>
</html>
