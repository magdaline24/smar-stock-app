<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stock - Receive Stock</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    <script src="sw-register.js"></script>
    <script src="offline-sync.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwcI_RRe3nRS8ZLxExsyyT4PDdtv5g4kg",
            authDomain: "smart-stock-app-da50f.firebaseapp.com",
            projectId: "smart-stock-app-da50f",
            storageBucket: "smart-stock-app-da50f.appspot.com",
            messagingSenderId: "512981075308",
            appId: "1:512981075308:web:491c04288f19aa26775f49"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function getCurrentCompanyId() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            return currentUser?.companyId || 'default';
        }

        // Helper: Convert Image to Base64 for saving in Firestore
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</head>
<body>
    <div class="form-container" style="max-width:100%;padding:10px;">
        <div class="form-box" style="max-width:100%;padding:15px;">
            <div class="form-header">
                <a href="dashboard.html" class="back-btn">← Back</a>
                <h1>📥 Receive Stock</h1>
                <p>Record incoming stock and upload documents</p>
            </div>

            <form id="receiveForm">
                <!-- Product & Delivery Note -->
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="receiveProduct" placeholder="Enter product name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Delivery Note Number *</label>
                        <input type="text" id="deliveryNote" placeholder="DN-12345" required>
                    </div>
                    <div class="form-group">
                        <label>Batch Number</label>
                        <input type="text" id="batchNumber" placeholder="BATCH-001">
                    </div>
                </div>

                <!-- Quantity & Expiry -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Quantity Received *</label>
                        <input type="number" id="receiveQty" placeholder="0" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Expiry Date</label>
                        <input type="date" id="receiveExpiry">
                    </div>
                </div>

                <!-- Received By & Date -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Received By *</label>
                        <input type="text" id="receivedBy" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label>Date Received</label>
                        <input type="date" id="receiveDate" required>
                    </div>
                </div>

                <!-- Photos (Delivery Note / LPO) -->
                <div class="form-group">
                    <label>Upload Delivery Note / LPO Photo</label>
                    <input type="file" id="documentPhoto" accept="image/*" capture="environment" style="padding:10px; border:2px solid #e0e0e0; border-radius:8px; width:100%;">
                    <p style="font-size:0.75rem;color:#888;margin-top:3px;">Take a photo of the physical receipt or LPO</p>
                </div>

                <button type="submit" class="btn-submit">✅ Save Receiving Record</button>
            </form>

            <!-- Previous Receiving Logs -->
            <div style="margin-top: 30px;">
                <h3 style="margin-bottom: 10px;">📋 Recent Receiving Logs</h3>
                <div id="receivingLogs" style="max-height: 400px; overflow-y: auto;">
                    <div style="text-align:center;padding:20px;color:#999;">Loading logs...</div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .log-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .log-item .log-title { font-weight: 700; font-size: 1rem; color: #333; }
        .log-item .log-details { font-size: 0.8rem; color: #666; margin-top: 5px; }
        .log-item img { max-width: 100px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; cursor: pointer;}
    </style>

    <script>
        // Set today's date on load
        document.getElementById('receiveDate').valueAsDate = new Date();

        // Load Logs on start
        document.addEventListener('DOMContentLoaded', async () => {
            await loadReceivingLogs();
        });

        // Handle Form Submit
        document.getElementById('receiveForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const productName = document.getElementById('receiveProduct').value;
            const deliveryNote = document.getElementById('deliveryNote').value;
            const batchNumber = document.getElementById('batchNumber').value;
            const qty = parseInt(document.getElementById('receiveQty').value);
            const expiry = document.getElementById('receiveExpiry').value;
            const receivedBy = document.getElementById('receivedBy').value;
            const dateReceived = document.getElementById('receiveDate').value;
            const photoFile = document.getElementById('documentPhoto').files[0];
            const companyId = getCurrentCompanyId();

            let photoBase64 = '';
            if (photoFile) {
                // Convert image to Base64 to save in Firestore
                photoBase64 = await getBase64(photoFile);
            }

            try {
                // 1. Save Receiving Record
                await db.collection('stockReceiving').add({
                    companyId: companyId,
                    product: productName,
                    deliveryNote: deliveryNote,
                    batchNumber: batchNumber,
                    quantity: qty,
                    expiryDate: expiry,
                    receivedBy: receivedBy,
                    dateReceived: dateReceived,
                    documentPhoto: photoBase64,
                    date: new Date().toISOString(), // System timestamp
                    status: 'Completed'
                });

                // 2. Add/Update Inventory
                const productsSnapshot = await db.collection('products')
                    .where('companyId', '==', companyId)
                    .where('name', '==', productName)
                    .get();

                if (productsSnapshot.empty) {
                    // Product doesn't exist, create it
                    await db.collection('products').add({
                        companyId: companyId,
                        name: productName,
                        category: 'Uncategorized',
                        quantity: qty,
                        price: 0,
                        expiryDate: expiry,
                        dateAdded: new Date().toISOString()
                    });
                } else {
                    // Product exists, update quantity
                    productsSnapshot.forEach(async (doc) => {
                        const currentQty = doc.data().quantity || 0;
                        await db.collection('products').doc(doc.id).update({
                            quantity: currentQty + qty,
                            expiryDate: expiry || doc.data().expiryDate
                        });
                    });
                }

                alert('✅ Stock Received successfully and added to inventory!');
                this.reset();
                document.getElementById('receiveDate').valueAsDate = new Date();
                await loadReceivingLogs(); // Refresh logs

            } catch (error) {
                console.error('Error receiving stock:', error);
                alert('❌ Error receiving stock: ' + error.message);
            }
        });

        // Load Recent Logs
        async function loadReceivingLogs() {
            const companyId = getCurrentCompanyId();
            const container = document.getElementById('receivingLogs');
            
            try {
                const snapshot = await db.collection('stockReceiving')
                    .where('companyId', '==', companyId)
                    .get();
                
                const logs = [];
                snapshot.forEach(doc => logs.push({ id: doc.id, ...doc.data() }));
                
                // Sort manually (Newest first)
                logs.sort((a, b) => new Date(b.date) - new Date(a.date));

                if (logs.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">No receiving logs yet</div>';
                    return;
                }

                container.innerHTML = logs.slice(0, 10).map(log => `
                    <div class="log-item">
                        <div class="log-title">${log.product} <span style="color:#22c55e;font-size:0.8rem;">+${log.quantity} Qty</span></div>
                        <div class="log-details">
                            <b>Delivery Note:</b> ${log.deliveryNote} | <b>Batch:</b> ${log.batchNumber || 'N/A'}<br>
                            <b>Received By:</b> ${log.receivedBy} | <b>Date:</b> ${new Date(log.dateReceived).toLocaleDateString()}<br>
                            <b>Expiry:</b> ${log.expiryDate ? new Date(log.expiryDate).toLocaleDateString() : 'N/A'}
                        </div>
                        ${log.documentPhoto ? `<img src="${log.documentPhoto}" onclick="window.open(this.src)" title="Click to view full image">` : ''}
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading logs:', error);
                container.innerHTML = '<div style="color:red;">Error loading logs</div>';
            }
        }
    </script>
</body>
</html>
